services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: company-iam-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "ChangeThis_Strong!Password123"
    ports:
      - "1433:1433"
    volumes:
      - iam_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ChangeThis_Strong!Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  iam_sql_data: